spring:
  application:
    name: portfolio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:CodeGroup}
    password: ${DB_PASSWORD:CodeGroup}
    driver-class-name: ${DB_DRIVER_CLASSNAME:org.postgresql.Driver}
  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    enabled: true
    change-log: ${LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog.yaml}